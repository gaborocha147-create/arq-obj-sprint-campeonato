spring.application.name=campeonato
spring.datasource.url=jdbc:h2:file:./data/campeonato

server.port=8080
# Chave de desenvolvimento; configure JWT_SECRET no ambiente de implantação.
jwt.secret=${JWT_SECRET:campeonato-chave-local-desenvolvimento-2026-32bytes}
jwt.expiration=${JWT_EXPIRATION:3600000}
